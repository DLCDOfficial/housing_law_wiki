- question: "What is middle housing?"
  answer: |
    "Middle housing" is statutorily defined as "housing that consists of duplexes, triplexes, quadplexes, cottage clusters or townhouses". The definition also includes bonus middle housing units allowed under ORS 197A.421 and existing units retained under ORS 197A.420(4).
- question: "What is a duplex/triplex/quadplex? Do they have to be attached?"
  answer: |
    A "duplex/triplex/quadplex" is statutorily defined as "two/three/four attached or detached dwellings in any configuration on a lot or parcel, other than a lot or parcel created by a middle housing land division." Plexes are not required to be attached. They may be attached or detached in any configuration.
- question: "What is a townhouse? How is that different from a plex?"
  answer: |
    A “townhouse” is statutorily defined as "a dwelling unit constructed in a row of two or more attached units, where each dwelling unit is located on an individual lot or parcel and shares at least one common wall with an adjacent unit." In contrast to plexes, townhouses are defined by being on an individual lot or parcel and sharing a common wall with an adjacent unit, whereas plexes may be attached or detached in any configuration on a lot or parcel, other than lots or parcels created by a middle housing land division.

    Note that the building code defines "townhouse" differently than ORS 197A.420, so the terms do not always align. In fact, any attached plex, townhouse, or cottage cluster unit could be regulated as a "townhouse" under building codes, depending on its configuration.
- question: "What is a cottage cluster?"
  answer: |
    A "cottage cluster" is statutorily defined as a "grouping of dwelling units: (A) That are detached or attached in subgroupings of up to four units in any configuration; (B) That have a common courtyard; and (C) That each have a small footprint or floor area."
- question: "Are accessory dwelling units middle housing?"
  answer: |
    No. Accessory dwelling units (ADUs) are not included in the statutory definition for middle housing. Instead, an ADU is defined as "an interior, attached or detached residential structure that is used in connection with or that is accessory to a single-unit dwelling."
- question: "Are single-room occupancies middle housing?"
  answer: |
    No. Single room occupancies (SROs) are not included in the statutory definition for middle housing. Instead, an SRO is defined as "a residential development with no fewer than four attached or detached units that are independently rented and lockable and provide living and sleeping space for the exclusive use of an occupant, but require that the occupant share sanitary or food preparation facilities with other units in the occupancy."
- question: "Are middle housing units defined as multi-unit dwellings? What about detached single-unit dwellings?"
  answer: |
    For the most part - no. The definition of "middle housing" does not include either multi-unit dwellings nor detached single-unit dwellings. "Detached single-unit dwelling" is not defined in ORS Chapter 197A. "Multiunit housing" for the most part is undefined in ORS Chapter 197A, except for laws authorizing inclusionary housing and for residential design standards. For those laws, "multiunit housing" is defined as "a structure that contains 10 or more dwelling units sharing at least one wall, floor or ceiling surface in common with another unit within the same structure." This definition is not universal and only applies to those two sections of law.

    While it is hypothetically possible for middle housing to overlap with the statutory "multiunit housing" definition, nothing in administrative rule implementing ORS 197A.420 requires a city or county to allow 10 or more attached units meeting the definition of multiunit housing. Middle housing may overlap with local definitions for "multi-unit" or "multifamily" housing, which vary between local governments.

    Finally, take note that statutory definitions for middle housing are distinct from the building code, so middle housing units can be regulated in different formats under the building code. Middle housing units could be regulated as "one- or two-family dwellings", "townhouses", "attached, stacked two-family dwellings", or "multifamily dwellings" under the building code, depending on the configuration of the structures.
- question: "Which cities are required to allow all middle housing types?"
  answer: |
    1) All Oregon counties (for urban, unincorporated land within an urban growth boundary), 2) All Oregon cities with a population of 25,000 or greater, 3) All Metro cities with a population of 1,000 or greater, and 4) All cities within Tillamook County and the communities of Barview/Twin Rocks/Watseco, Cloverdale, Hebo, Neahkahnie, Neskowin, Netarts, Oceanside and Pacific City/Woods. As a shorthand, administrative rule defines these as "large cities".
- question: "Which cities are required to allow only duplexes?"
  answer: |
    All Oregon cities outside of Metro with a population of 2,500 or greater are required to allow duplexes as well as bonus units allowed under ORS 197A.421 and retained units under ORS 197A.420(4). These cities are not required to allow other middle housing types but may choose to do so. As a shorthand, administrative rule refers to these as "medium cities".
- question: "What are bonus units?"
  answer: "ORS 197A.421 allows the siting of one or more bonus units in addition to middle housing meeting specific affordability or accessibility requirements in statute."
- question: "What are retained units?"
  answer: "ORS 197A.420(4) allows a lot or parcel to retain an existing detached single-unit dwelling, single-unit dwelling and accessory dwelling unit, or duplex as part of a middle housing development. These units may be retained, rather than required to be demolished or converted, in order to accommodate a middle housing development. Additionally, these retained units may be placed onto a separate lot as part of a middle housing land division under ORS 92.031."
- question: "Where must middle housing/duplexes be allowed?"
  answer: |
    In cities where the law applies, middle housing (or duplexes for medium cities) must be allowed "on each lot or parcel zoned for residential use". "Zoned for residential use" is statutorily defined as "land that: 
  
      (A) Is within an urban growth boundary; 

      (B) Has base zoning for, or is designated to allow, residential uses; 

      (C) Allows the development of a detached single-unit dwelling; 

      (D) Is not zoned primarily for commercial, industrial, agricultural or public uses; and 

      (E) Is incorporated or urban unincorporated land."
- question: 'What are "urban unincorporated lands"?'
  answer: |
    “Urban unincorporated lands” are statutorily defined as "lands within an urban growth boundary that are identified by the county as: 

      (a) Not within a city; 

      (b) Zoned for urban development; 

      (c) Within the boundaries of a sanitary district or sanitary authority formed under ORS chapter 450 or a district formed for the purposes of sewage works under ORS chapter 451; 

      (d) Within the service boundaries of a water provider with a water system subject to regulation as described in ORS 448.119; and 

      (e) Not zoned with a designation that maintains the land’s potential for future urbanization."
- question: "How may cities or counties regulate middle housing?"
  answer: "ORS 197A.420(5) authorizes local governments to regulate the siting and design of middle housing and to apply protective measures adopted pursuant to statewide land use planning goals. Siting and design regulations cannot discourage the development of middle housing through unreasonable costs or delay. Oregon Administrative Rules, chapter 660, division 46 provides more specific details and parameters relating to how local governments may regulate middle housing."
- question: "When must a city or county adopt conforming middle housing codes?"
  answer: "Section 3, chapter 639, Oregon Laws 2019 (as amended by section 4, chapter 476, Oregon Laws 2025) sets out specific deadlines by which affected cities and counties must comply with middle housing requirements, including subsequent amendments to the law. Additionally, OAR 660-046-0050 establishes deadlines for cities that trigger a population threshold."
- question: "What happens if a jurisdiction does not adopt a compliant development code by the statutory deadline?"
  answer: "Section 3(3), chapter 639, Oregon Laws 2019 specifies that a local government that has not acted within the statutory deadline must apply a model ordinance adopted by LCDC directly to development as provided by ORS 197.646 (3). OAR 660-046-0040 establishes more specific parameters on local governments that do not meet the statutory deadline."
