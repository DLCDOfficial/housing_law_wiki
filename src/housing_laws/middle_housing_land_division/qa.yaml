- question: "Are cities and counties required to develop standards allowing for a middle housing land division? What happens if a local government does not have conforming amendments?"
  answer: "ORS 197.646 requires local governments to amend acknowledged comprehensive plan and land use regulations to comply with a new requirements in land use statutes or administrative rules. When a local government does not adopt conforming amendments, the new requirements apply directly to the local government's land use decisions. Additionally, OAR 660-008-0420 allows local governments to apply a model code module directly where local code is nonconforming to comply with a housing law. For middle housing land divisions, this means a local government must either 1) adopt conforming amendments, 2) apply the statute directly, or 3) apply the middle housing land division model code module directly in order to comply with the law."
- question: "What middle housing types are eligible for division under ORS 92.031?"
  answer: |
    A proposal for the development of middle housing meeting applicable building code and land use regulations may consist of: A) A single duplex, triplex, quadplex, cottage cluster or structure containing townhouses, B) Additional "bonus" units allowed under ORS 197A.421(3), and C) Retained or rehabilitated existing units allowed under ORS 197A.420(4), if any.

    Some proposals may not be eligible for a middle housing land division if they contain housing types that are not encompassed in the list above. Examples include the division of a detached single-unit and accessory dwelling unit onto separate lots or a division of lots containing detached single-unit dwellings.
- question: "Are multiple middle housing developments eligible for a middle housing land division?"
  answer: |
    Where a development proposal contains either multiple middle housing developments or a mix of middle housing developments and other housing types, applicants may submit for one or more middle housing land divisions concurrently with a standard partition or subdivision under ORS 92.044. These processes would follow the procedural requirements and timelines of the standard partition or subdivision (typically a 120-day decision timeline instead of 63 days). The "parent" lots would be platted via the standard subdivision/partition, whereas the middle housing or "child" lots would be further divided via a middle housing land division.
- question: "ORS 92.031 requires cities or counties to apply the expedited land division process. What is this and how is it different from a typical land use application?"
  answer: "Expedited land divisions are a unique process specified in ORS 197A.140 and 197A.142 applied to middle housing land divisions and other qualifying land divisions. The process requires a local government to approve or deny an application within 63 days of receiving a complete application. The procedure disallows holding a hearing on the application or a third party to intervene to oppose the application, and it prescribes specific requirements for the written notice, decision, and fees assessed to process an application. Finally, only the applicant may appeal an expedited land division."
- question: "The eligibility for an expedited land division under ORS 197A.142 is limited to partitions or subdivisions meeting specific requirements. Does this limit eligibility for middle housing using the expedited land division process?"
  answer: |
    No. ORS 92.031(4)(a) states that a city or county "[s]hall apply the procedures applicable to an expedited land division under ORS 197A.140, if requested by the applicant and without regard to the criteria in ORS 197A.142(1)."
- question: "Can a city or county apply a typical land division process to a middle housing land division application?"
  answer: |
    A city or county may provide the option for a typical land division but must apply the expedited land division process if requested by the applicant. ORS 92.031(4)(a) states that a city or county "[s]hall apply the procedures applicable to an expedited land division under ORS 197A.140, if requested by the applicant[.]"
- question: "When can an applicant submit an application for a middle housing land division in relationship to building permits?"
  answer: |
    ORS 92.031(4) states that a city or county "[s]hall allow the submission of an application for a tentative plan for a middle housing land division before, after or at the same time as the submission of an application for building permits for the middle housing."
- question: "Are applicants able to extend the 63-day review timeline for a middle housing land division?"
  answer: |
    Yes. For cities, ORS 227.178(5) states that the required 63-day review timeline "may be extended for a specified period of time at the written request of the applicant. The total of all extensions [not including a separate provision allowing an additional 90-day extension to mediate disputes] may not exceed 245 days." For counties, the corollary provision under ORS 215.427(5) is identical, except the total combined extension limit is 215 days.
- question: "Are cities and counties allowed to extend the expiration timeline for a final plat for a middle housing land division beyond three years?"
  answer: |
    ORS 92.031(8) states "The tentative approval of a middle housing land division is void if and only if a final subdivision or partition plat is not approved within:
    (a) three years of the tentative approval; or (b) A period equal to that allowed by the city or county for the plat or plan that is submitted concurrently with the division as described in ORS 92.044"
- question: "What requirements or conditions may a city or county impose on a middle housing land division?"
  answer: |
    A city or county must approve a tentative plan for a middle housing land division for an application meeting all of the criteria set forth in ORS 92.031(2). In addition, a city or county may impose the following requirements or conditions under ORS 92.031:

    * §(3)(a) and (6) - Prohibit or add approval criteria to the allowance of a new accessory dwelling unit or further division of resulting lots or parcels in certain circumstances

    * §(3)(b) - Require notation in the final plat indicated that the approval was given under ORS 92.031

    * §(4)(b) - Require street frontage improvements where a resulting lot or parcel abuts the street consistent with land use regulations implementing ORS 197A.420

    * §(4)(f) - Require dedication of right of way if the original parcel did not previously provide a dedication

    * §(4)(g) - Require separate water and wastewater utilities for each dwelling unit
- question: "Can a city or county impose additional requirements other than what is specified in ORS 92.031, such as requiring minimum lot sizes or street frontages?"
  answer: |
    No. ORS 92.031(4)(c) states that a city or county "[m]ay not subject an application to approval criteria except as provided in this section, including that a lot or parcel require driveways, vehicle access, parking or minimum or maximum street frontage."
- question: "Can jurisdictions require that easements be submitted in a form approved by the City Attorney and address specific issues like maintenance and repair, cost-sharing, access, notice, damage, disputes, etc.?"
  answer: |
    Cities and counties are authorized under ORS 92.0312(2)(c) to require "proposed easements necessary for each dwelling unit on the plan for:

    * (A) Locating, accessing, replacing and servicing all utilities;

    * (B) Pedestrian access from each dwelling unit to a private or public road;

    * (C) Any common use areas or shared building elements;

    * (D) Any dedicated driveways or parking; and

    * (E) Any dedicated common area."

    HAPO recommends ensuring applicable requirements are clear and objective and reviewed for statutory consistency by legal counsel.
- question: "Are cities or counties prohibited from requiring off-street parking for middle housing land divisions?"
  answer: "Middle housing land divisions still must meet applicable siting and design standards under ORS 197A.420(5). Administrative rules (OAR chapter 660, division 46) allow local governments to require up to a specified amount of off-street parking for middle housing. However, a city or county is prohibited from subjecting a middle housing land division application to an approval criterion that a lot or parcel require parking."
- question: "Can cities or counties require a middle housing lot to front the street?"
  answer: |
    No. ORS 92.031(4)(c) prohibits a local government from applying approval criteria to a middle housing land division except as provided under state, "including that a lot or parcel require* * * minimum or maximum street frontage."
- question: "Cities or counties cannot require street frontage under ORS 92.031, but can they limit how many lots within a land division do not have street frontage? For example, could a city limit the number of cottages in a cottage cluster development that only have street access from an access easement?"
  answer: "ORS 92.031 states that a city or county “may not subject an application to approval criteria except as provided in this section.” The restriction on minimum or maximum frontage is an explicit example of this prohibition. Because there is nothing in this section specifying the number of units that may only have street access from an access easement, a city or county would not be able to include such a limitation as a standard or condition of approval."
- question: "ORS 92.031(4)(b) allows cities or counties to require street frontage improvements. Would this enable them to require frontage improvements that might otherwise be exempted for detached single-unit dwellings, which is prohibited in OAR chapter 660, division 046?"
  answer: |
    ORS 92.031(4)(b) allows a city or county to require frontage improvements "where a resulting lot or parcel abuts the street consistent with land use regulations implementing ORS 197A.420." This means that street frontage improvement requirements must be consistent with ORS 197A.420 and implementing rules under OAR chapter 660, division 46.
- question: "Does ORS 92.031 require local jurisdictions to approve vertical divisions (i.e., divisions in which one or more units of middle housing is not on the ground floor) of middle housing in addition to horizontal divisions?"
  answer: "ORS 92.031 does not speak to vertical divisions of middle housing and requires that each resultant lot or parcel contain exactly one unit. It is not clear how a vertical division could meet this requirement."
- question: "Does ORS 92.031 apply to lot divisions for townhouses allowed under ORS 197A.420?"
  answer: |
    Yes. ORS 92.031(2) requires a city or county to approve a tentative plan for a middle housing land division if the application includes "a proposal for development of middle housing * * * and which may consist of * * * a structure containing townhouses." Where an application includes multiple structures containing townhouses, the site must be partitioned or subdivided to create the “parent” lots or parcels. As part of this partition or subdivision, an applicant may concurrently submit applications for middle housing land divisions to further divide the resultant lots or parcels into individual middle housing lots.
- question: "The bill restricts cities or counties from applying minimum or maximum frontage requirements to lots or parcels created under ORS 92.031. This seems to conflict with OAR 660-046-0220(3)(b) regarding minimum street frontages applied to townhouses. Are jurisdictions permitted to apply minimum street frontages to townhouses?"
  answer: "Correct. OAR 660-046-0220(3)(b) was adopted before the legislative adoption of ORS 92.031. Where this occurs, statute prevails over administrative rule. The effect of this new statutory prohibition on requiring minimum or maximum street frontage is that the allowance in rule for up to 20 ft of required street frontage may not be applied for middle housing land divisions containing townhouses."
- question: "Can a city require additional drywall between attached units that result from a middle housing land division? This would increase the fire rating and meet the intent of fire separation for structures that are divided by a lot line (i.e., similar to a townhouse) in alignment with Section R302 of the 2021 Oregon Residential Specialty Code."
  answer: |
    The definition of a "townhouse" in ORS 197A.420 is different than what the building code defines as a "townhouse."  This is important because all middle housing types could possibly be classified as townhouses under building codes, depending on their configuration. For middle housing land divisions, ORS 92.031(2)(e) requires that the buildings or structures will comply with "applicable building codes provisions relating to new property lines and, notwithstanding the creation of new lots or parcels, how structures or buildings located on the newly created lots or parcels will comply with the Oregon residential specialty code."

    Attached units in a middle housing land division are typically regulated as townhouses under the building code. This means that the units will need to meet applicable townhouse standards in order to comply with the criterion above. This includes a required two-hour fire rated wall assembly between units.
- question: "Are accessory dwelling units (ADUs) allowed with townhouses (attached rowhouses) through ORS 197A.420 and 197A.425? If not, could a local government optionally allow ADUs with townhouses?"
  answer: |
    A "townhouse" is not a "detached single-unit dwelling" under statute. Therefore, the requirement to allow an ADU in conjunction with a detached single-unit dwelling under ORS 197A.425 does not apply to townhouses. Nothing in state law prohibits a local government from allowing an ADU in conjunction with a townhouse. Additionally, the building code now allows "attached stacked two-family dwellings" meaning an ADU can be provided in both attached and detached configurations with a townhouse unit, if a city chooses to allow it.
- question: "Could an accessory dwelling unit (ADU) be split off on to its own lot through ORS 92.031?"
  answer: "ORS 92.031(2)(d)(B) allows an existing detached single-unit dwelling and accessory dwelling unit (ADU) to be separated onto a single lot. The statute does not allow for the separation of an ADU onto its own separate lot or parcel. However, detached and attached plex units are similar to ADUs in form and are eligible for a middle housing land division."
- question: "ORS 92.031(2)(d) states that the resulting lots may only have exactly one dwelling after the division. Does this mean that a stacked duplex will not be able to add a detached third unit even if it is classified as a detached triplex? Would this also hold true for any existing legacy lot that has stacked units (duplex, triplex, or quadplex) that wishes to add a detached unit?"
  answer: "ORS 92.031(2)(d)(B) allows for lots containing an existing detached single-unit dwelling and accessory dwelling unit or duplex to be separated onto its own lot. This allows a configuration in which an existing stacked duplex could add a detached plex unit and divide the property into two lots via a middle housing land division. This flexibility does not extend to existing stacked triplexes or quadplexes, however."
- question: "Per ORS 92.031(2)(d) requires “exactly one dwelling unit on each resulting lot or parcel, except for lots, parcels or tracts used as common areas.” Does this mean a duplex, triplex, or quadplex cannot be on one tax lot?"
  answer: |
    No. ORS 92.031 provides the applicant the optional ability to divide a lot containing middle housing such that each middle housing unit is on its own lot. This enables the applicant to sell individual units on individual lots in a "fee-simple" manner. It does not require the applicant to divide the lot, so an applicant can choose simply to not divide the lot and either rent the units or establish a condominium for individual sale.
- question: "Per ORS 92.031(2)(d), is each unit required to be on its own tax lot with its own meter?"
  answer: "ORS 92.031(2)(d) requires each unit to be on its own lot or parcel, except for (A) Lots, parcels or tracts used as common areas, or (B) Lots or parcels with a detached single-unit dwelling and accessory dwelling unit or a duplex as allowed under ORS 197A.420 (4). Additionally, ORS 92.031(2)(a) requires separate utilities for each dwelling unit, except a local government may either allow shared water and wastewater or require separate water and wastewater under ORS 92.031(4)(g)."
- question: "Does ORS 92.031(2)(b) relating to separate utilities for each dwelling unit apply only to middle housing? Or could they apply to other developments, such as multi-unit developments?"
  answer: "ORS 92.031 only applies to middle housing developments that choose to divide the lot. Middle housing includes only duplexes, triplexes, quadplexes, townhouses, and cottage clusters as well as bonus units under ORS 197A.421 and existing units under ORS 197A.420(4). The requirement for separate utilities does not extend to other housing types, including accessory dwelling units, single-room occupancies, or multi-unit dwellings."
- question: "Can a city require street trees with an expedited land division for middle housing?"
  answer: "ORS 92.031(4)(c) prohibits subjecting applications for a middle housing land division to approval criteria except as provided in that section. However, local governments are still permitted to require street trees of middle housing generally as part of siting and design regulations authorized under ORS 197A.420."
- question: "Does ORS 92.031 require cities and counties to allow a middle housing land division on a large lot or site that can accommodate multiple middle housing developments? Is there a limit for how large a middle housing land division can be?"
  answer: "ORS 92.031(2)(b)(A) through (C) clarifies that only a single middle housing development is eligible for a middle housing land division (i.e. one plex, cottage cluster, or structure with townhouses, plus bonus and retained units). This means that to accommodate more than one middle housing development, the site would need to be partitioned or subdivided into developable “parent lots.” As part of this standard land division, the city or county must also allow the applicant to submit multiple middle housing land division applications concurrently with the standard land division to allow for further division of the “parent lots” into individual middle housing lots."
- question: "Are cities or counties permitted to require a hearing for a middle housing land division processed as an expedited land division?"
  answer: "No. ORS 197A.140(2)(d) prohibits a city or county from holding a hearing on the application or allowing any third party to intervene to oppose the application."
- question: "Who is eligible to appeal a middle housing land division processed as an expedited land division?"
  answer: "ORS 197A.140(3) allows only the applicant to appeal an expedited land division."
- question: "What procedure may a city or county apply for one or more middle housing land divisions processed concurrently with a subdivision or partition?"
  answer: "ORS 92.044(1)(c)(C) requires a city or county to provide a method that allows the further division of one or more resulting lots of a subdivision or partition via concurrently submitted middle housing land division (MHLD) applications. The Housing Model Code for Large Cities operationalizes this direction by allowing an applicant to consolidate one or more MHLDs with a standard land division, subject to the procedural requirements of the standard land division."
- question: "Our local government has not adopted conforming code for middle housing land divisions under ORS 92.031. How can we comply with the law?"
  answer: "There are three options for complying with a housing law. To comply with ORS 92.031, the local government can: 1) adopt conforming amendments under ORS 197.646(1), 2) apply the law directly to land use decisions under ORS 197.646(3), or 3) apply the middle housing land division model code module directly to land use decisions as allowed under OAR 660-008-0420."
  
