title: Housing Law Library
description: “Housing laws”, [as defined in ORS 197A.800(5)](https://www.oregonlegislature.gov/bills_laws/ors/ors197A.html#:~:text=to%20197A.820%3A-,(a)%20%E2%80%9CHousing%20law%E2%80%9D,-means%20ORS%20chapter), establish the scope of the Housing Accountability and Production Office’s statutory authority. The office provides technical assistance and guidance to local governments and housing producers to support the effective implementation of these laws. 
disclaimer: This resource is not a definitive or exhaustive list of all housing laws or other related laws. Additionally, this resource is not a substitution for legal counsel, and the accuracy of the information provided herein is not guaranteed. Should you have questions about a housing law or a specific development application, please reach out to HAPO at the following intake form: [https://www.oregon.gov/lcd/HAPO/Pages/Inquiries-and-Complaints.aspx](https://www.oregon.gov/lcd/HAPO/Pages/Inquiries-and-Complaints.aspx)
